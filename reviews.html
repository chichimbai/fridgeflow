          <a href="cabinet.html">

        </nav>
        <p class="sidebar-note">Меньше отходов.<br />Больше пользы.</p>
      </aside>

      <main class="dashboard">
        <header class="greeting">
          <p class="eyebrow">FridgeFlow</p>
          <h1>Отзывы</h1>
          <p>Один отзыв на человека. Свой можно менять или удалить, чужой — скрыть только у себя.</p>
        </header>

        <section class="panel">
          <form id="review-form" class="recipe-form">
            <fieldset class="rating" id="star-picker">
              <legend>Оценка сайта</legend>
            </fieldset>
            <label>
              Ваш отзыв
              <textarea name="text" maxlength="400" required placeholder="Коротко, как вам FridgeFlow"></textarea>
            </label>
            <p id="review-error" class="recipe-miss" hidden></p>
            <div class="form-actions">
              <button class="action" type="submit">Опубликовать</button>
              <button class="action action-quiet" id="review-delete" type="button" hidden>Удалить</button>
            </div>
            <p id="review-confirm" class="review-confirm" hidden>
              Удалить отзыв? Вернуть его потом не получится.
              <button class="action" id="review-delete-yes" type="button">Да, удалить</button>
              <button class="action action-quiet" id="review-delete-no" type="button">Нет</button>
            </p>
          </form>
        </section>

        <section class="panel" id="review-list" aria-live="polite"></section>
      </main>
    </div>
    <script src="script.js"></script>
    <script src="reviews.js"></script>
  </body>
